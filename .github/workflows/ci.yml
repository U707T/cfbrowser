name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 静态检查与针对性单测。仓库里还有大量 info 级 lint（上游遗留），
  # 因此这里只做提示，不阻断构建；真正的门禁是下面的编译。
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # project_prep 会用 cargo 现编译一个工具来生成代理证书，所以先装 Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate l10n
        run: dart run tool/project_prep.dart app

      # devtools_extension 是独立包（不参与 App 构建），排除掉
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-pub lib test

      - name: Targeted tests
        run: |
          flutter test --no-pub \
            test/services/browser_scope_service_test.dart \
            test/services/browser_quick_links_service_test.dart \
            test/services/browser_tabs_service_test.dart \
            test/services/segmented_download_test.dart \
            test/services/proxy_leaf_trust_test.dart

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # action 的 cache 只管 Flutter SDK；pub 与 Gradle 依赖另存
      - name: Cache pub and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pubgradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            pubgradle-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # flutter.ndkVersion 在 3.47 是 28.2.13676358，runner 自带的不一定对得上。
      # 不用 android-actions/setup-android：它默认还要装已下架的 `tools` 包，会直接失败
      - name: Install NDK
        run: |
          SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;28.2.13676358" | tail -3
          ls "$ANDROID_SDK_ROOT/ndk"

      # core/doh_proxy 由 Rust 实现，Android 侧经 cargo-ndk 产出 .so
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # core/doh_proxy 的 target/ 是全量重编的大头（rama + BoringSSL + bindgen），
      # 有缓存后增量只有改动的那几个 crate。
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            core/doh_proxy/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('core/doh_proxy/Cargo.lock') }}-${{ hashFiles('core/doh_proxy/build.rs', 'core/doh_proxy/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('core/doh_proxy/Cargo.lock') }}-

      # 固定签名密钥：缺 secrets 时硬失败，绝不发出 debug 签名的包
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 secrets.$name：不能发 debug 签名的包"
              exit 1
            fi
          done
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/release.jks
          EOF
          echo "keystore $(stat -c%s android/keystore/release.jks) bytes"


      # flutterw 会先跑 project_prep（pub get / l10n / 代理证书），再 cargo ndk 编译 Rust
      - name: Build arm64
        run: |
          dart tool/flutterw.dart build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk cfbrowser-arm64-v8a.apk

      # 守住签名：APK 证书指纹必须等于 secrets 里那把，回落 debug 就失败
      - name: Verify APK signing
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -list -v -keystore android/keystore/release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "expected=$EXPECTED"
          for apk in cfbrowser-arm64-v8a.apk; do
            GOT=$(apksigner verify --print-certs "$apk" \
              | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr 'A-Z' 'a-z')
            echo "$apk -> $GOT"
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "::error::$apk 的签名指纹与预期不符（回落成 debug 签名了？）"
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfbrowser-apk
          path: cfbrowser-arm64-v8a.apk
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cfbrowser-arm64-v8a.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
