name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 静态检查与针对性单测。仓库里还有大量 info 级 lint（上游遗留），
  # 因此这里只做提示，不阻断构建；真正的门禁是下面的编译。
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # project_prep 会用 cargo 现编译一个工具来生成代理证书，所以先装 Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate l10n
        run: dart run tool/project_prep.dart app

      # devtools_extension 是独立包（不参与 App 构建），排除掉
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-pub lib test

      - name: Targeted tests
        run: |
          flutter test --no-pub \
            test/services/browser_scope_service_test.dart \
            test/services/browser_quick_links_service_test.dart \
            test/services/browser_tabs_service_test.dart \
            test/services/segmented_download_test.dart \
            test/services/proxy_leaf_trust_test.dart

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # action 的 cache 只管 Flutter SDK；pub 与 Gradle 依赖另存。
      # 不要只留 modules-2 而砍掉 caches/<版本>：实测这样 transforms 全丢，
      # 配置阶段从 67 s 涨到 176 s，比省下的还原时间还贵。
      - name: Cache pub and Gradle
        id: pubgradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache/hosted
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: pubgradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            pubgradle-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # flutter.ndkVersion 在 3.47 是 28.2.13676358，runner 自带的不一定对得上。
      # 不用 android-actions/setup-android：它默认还要装已下架的 `tools` 包，会直接失败
      - name: Install NDK
        run: |
          SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager = $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;28.2.13676358" | tail -3
          ls "$ANDROID_SDK_ROOT/ndk"

      # core/doh_proxy 由 Rust 实现，Android 侧经 cargo-ndk 产出 .so
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 下面这份 cache 存的是 cargo-ndk 二进制本身，让下面那步从 20 s 变 1 s
      - name: Cache cargo-ndk binary
        id: cargondk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-ndk-${{ runner.os }}-v1

      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk 已在缓存里：$(cargo ndk --version 2>&1 | head -1)"
          else
            cargo install cargo-ndk --locked
          fi

      # core/doh_proxy 的 target/ 是全量重编的大头（rama + BoringSSL + bindgen），
      # 有缓存后增量只有改动的那几个 crate。
      - name: Cache Rust build
        id: rustcache
        uses: actions/cache@v4
        with:
          path: |
            core/doh_proxy/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('core/doh_proxy/Cargo.lock') }}-${{ hashFiles('core/doh_proxy/build.rs', 'core/doh_proxy/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('core/doh_proxy/Cargo.lock') }}-

      # super_clipboard / super_drag_and_drop / rhttp 这几个 pub 包用 cargokit 在
      # Gradle 里现编 Rust，target 目录落在 build/<插件>/build，谁都缓存不到。
      # 实测冷编 122.7 s（rhttp 98.7 / super_native_extensions 20.5 / irondash 3.5），
      # 热编 3.5 s。
      - name: Cache cargokit Rust targets
        id: cargokit
        uses: actions/cache@v4
        with:
          path: |
            build/rhttp/build
            build/super_native_extensions/build
            build/irondash_engine_context/build
          key: cargokit-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            cargokit-${{ runner.os }}-

      # 固定签名密钥：缺 secrets 时硬失败，绝不发出 debug 签名的包
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 secrets.$name：不能发 debug 签名的包"
              exit 1
            fi
          done
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/release.jks
          EOF
          echo "keystore $(stat -c%s android/keystore/release.jks) bytes"


      # ============ 以下 DIAG 步骤只存在于 diag/gradle-timing 分支，测完删除 ============
      # 目的：把 assembleRelease 的 ~790 s 拆到「任务 × 起止时间 × 是否命中缓存」。
      # 说明：Gradle 的 --profile 加不进来（flutter 每次构建都会用 SDK 模板覆盖
      # android/gradlew，且 startParameter 在 init script 里改已来不及），
      # 所以改用 init script 打点：信息量是 --profile 的超集（多了时间线）。
      - name: 'DIAG · 注入 Gradle 任务打点'
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/zz-diag-timeline.gradle <<'GRADLE'
          println "[[DIAG]] init-loaded @${System.currentTimeMillis()}"
          gradle.taskGraph.whenReady { g ->
              println "[[DIAG]] graph-ready tasks=${g.allTasks.size()} @${System.currentTimeMillis()}"
          }
          gradle.taskGraph.beforeTask { t ->
              println "[[DIAG-START]] ${t.path} @${System.currentTimeMillis()}"
          }
          gradle.taskGraph.afterTask { t, s ->
              String st = s.failure != null ? 'FAILED' : (s.upToDate ? 'UP-TO-DATE' : (s.fromCache ? 'FROM-CACHE' : (s.skipped ? 'SKIPPED' : 'EXECUTED')))
              println "[[DIAG-END]] ${t.path} @${System.currentTimeMillis()} ${st}"
          }
          GRADLE
          cat ~/.gradle/init.d/zz-diag-timeline.gradle

      # flutterw 会先跑 project_prep（pub get / l10n / 代理证书），再 cargo ndk 编译 Rust
      - name: Build arm64
        run: |
          set -euo pipefail
          echo "DIAG build begin: $(date -u +%FT%TZ)"
          dart tool/flutterw.dart build apk --release --target-platform android-arm64 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
          echo "DIAG build end: $(date -u +%FT%TZ)"
          cp build/app/outputs/flutter-apk/app-release.apk cfbrowser-arm64-v8a.apk

      - name: 'DIAG · 任务时间线'
        if: always()
        run: |
          python3 tool/ci/diag_timeline.py "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/build-nolegacy.log" 2>&1 | tee timeline.txt

      - name: 'DIAG · 计量'
        if: always()
        run: |
          set -xo pipefail
          {
            echo "=== runner ==="
            nproc
            grep -m1 'model name' /proc/cpuinfo || true
            free -g | head -3
            echo "=== cache ==="
            echo "pubgradle cache-hit: ${{ steps.pubgradle.outputs.cache-hit }}"
            echo "cargo-ndk cache-hit: ${{ steps.cargondk.outputs.cache-hit }}"
            echo "rust      cache-hit: ${{ steps.rustcache.outputs.cache-hit }}"
            echo "cargokit  cache-hit: ${{ steps.cargokit.outputs.cache-hit }}"
            du -sh ~/.gradle ~/.cargo 2>/dev/null || true
            echo "=== apk ==="
            ls -l build/app/outputs/flutter-apk/app-release.apk
            unzip -v build/app/outputs/flutter-apk/app-release.apk | awk 'NR<4 || $8 ~ /^lib\//'
            echo "=== .so 原始体积 + 单核 deflate 成本（AGP 打包是单线程 zipflinger，gzip -6 为代理）==="
            SO=$(find build/app/intermediates -type d -path '*stripped_native_libs*' -name 'arm64-v8a' | head -1)
            echo "SO_DIR=$SO"
            du -sh "$SO" || true
            ls -l "$SO" | sort -k5 -n | tail -12
            bytes=$(du -sb "$SO" | cut -f1)
            s=$(date +%s%N); cat "$SO"/*.so | gzip -6 > /dev/null; e=$(date +%s%N)
            echo "deflate bytes=$bytes ms=$(( (e - s) / 1000000 ))"
            echo "=== cargokit 的 rust target 目录（subproject buildDir = build/<name>/build）==="
            du -sh build/*/build 2>/dev/null | sort -rh | head -10 || true
            echo "=== 各 subproject build 体积 top 10 ==="
            du -sh build/* 2>/dev/null | sort -rh | head -10 || true
          } 2>&1 | tee measurement.txt

      - name: 'DIAG · 上传诊断产物'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-timeline
          path: |
            timeline.txt
            measurement.txt
            ${{ runner.temp }}/build.log
          if-no-files-found: warn
      # ============ DIAG 结束 ============

      # 守住签名：APK 证书指纹必须等于 secrets 里那把，回落 debug 就失败
      - name: Verify APK signing
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -list -v -keystore android/keystore/release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "expected=$EXPECTED"
          # runner 只装了 NDK，没有完整 build-tools，apksigner 不在 PATH；
          # keytool 能直接读 APK 里的签名块，不必额外装 SDK 组件
          GOT=$(keytool -printcert -jarfile cfbrowser-arm64-v8a.apk 2>/dev/null \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
          echo "apk -> $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::APK 的签名指纹与预期不符（回落成 debug 签名了？）"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfbrowser-apk
          path: cfbrowser-arm64-v8a.apk
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cfbrowser-arm64-v8a.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
